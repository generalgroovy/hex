<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000"><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 10L10 -2M8 12L12 8" stroke="#edb861" stroke-width="2"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#69d2c5" stroke-width="1.7"/></marker></defs><rect x="0" y="0" width="1680" height="1000" rx="0" fill="#111f27" stroke="none" stroke-width="1" /><text x="44" y="43" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#69d2c5" text-anchor="start" >06 / EXPANSION CONTRACT</text><text x="44" y="94" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#f4e8ca" text-anchor="start" >The Wellspring grows by useful loops</text><text x="44" y="129" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >SCHEMATIC ONLY • no proposed global coordinates • reuse existing districts before enlarging the collision world</text><rect x="625" y="210" width="420" height="215" rx="14" fill="#1b2d35" stroke="#edb861" stroke-width="2" /><text x="649" y="252" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#edb861" text-anchor="start" >01 / COURTYARD</text><text x="649" y="294" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#f4e8ca" text-anchor="start" >Source Court + existing Crucible</text><text x="649" y="334" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >Now: two covers, two exits,</text><text x="649" y="361" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >quiet floor</text><rect x="68" y="300" width="410" height="210" rx="14" fill="#1b2d35" stroke="#46605f" stroke-width="2" /><text x="92" y="342" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#edb861" text-anchor="start" >02 / MOVEMENT GARDENS</text><text x="92" y="384" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#f4e8ca" text-anchor="start" >Existing west campus</text><text x="92" y="424" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >Wall tangent → turn pocket →</text><text x="92" y="451" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >ordinary return</text><rect x="1180" y="300" width="430" height="210" rx="14" fill="#1b2d35" stroke="#46605f" stroke-width="2" /><text x="1204" y="342" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#edb861" text-anchor="start" >03 / PATTERNS + DUELS</text><text x="1204" y="384" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#f4e8ca" text-anchor="start" >Existing east campus</text><text x="1204" y="424" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >Separated target range +</text><text x="1204" y="451" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >retained duel anchors</text><rect x="625" y="600" width="420" height="200" rx="14" fill="#1b2d35" stroke="#46605f" stroke-width="2" /><text x="649" y="642" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#edb861" text-anchor="start" >04 / LIVING ARCHIVE</text><text x="649" y="684" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#f4e8ca" text-anchor="start" >Learning + Farflow interfaces</text><text x="649" y="724" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >Reference and party controls,</text><text x="649" y="751" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >not more boards</text><polyline points="625,270 525,270 525,350 478,350" fill="none" stroke="#69d2c5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><polyline points="478,453 552,453 552,395 625,395" fill="none" stroke="#69d2c5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><polyline points="1045,270 1110,270 1110,350 1180,350" fill="none" stroke="#69d2c5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><polyline points="1180,453 1115,453 1115,395 1045,395" fill="none" stroke="#69d2c5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><polyline points="770,425 770,600" fill="none" stroke="#69d2c5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><polyline points="900,600 900,425" fill="none" stroke="#69d2c5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><text x="68" y="600" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#69d2c5" text-anchor="start" >REUSABLE SOCKET</text><text x="68" y="638" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >192 px main walk; 160 px secondary</text><text x="68" y="666" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >return. Cardinal floor; optional</text><text x="68" y="694" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >chemistry grid overlay. Two non-</text><text x="68" y="722" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >coincident exits. Dimensions are</text><text x="68" y="750" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >design constraints, not built doors.</text><text x="1180" y="600" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#ed927b" text-anchor="start" >BEFORE A NEW POCKET</text><text x="1180" y="638" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >Accept existing movement choices</text><text x="1180" y="666" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >first. Then measure active-cell,</text><text x="1180" y="694" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >packing, event and rendered work at</text><text x="1180" y="722" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >equal demand. One new pocket at a</text><text x="1180" y="750" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >time. Foundry / seasonal reaches</text><text x="1180" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b1beb7" text-anchor="start" >remain unplaced.</text><rect x="68" y="848" width="1542" height="104" rx="12" fill="#283b3c" stroke="none" stroke-width="1" /><text x="92" y="885" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#edb861" text-anchor="start" >DO NOT SCALE ACTIVE SIMULATION WITH MAP ACREAGE</text><text x="92" y="919" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#f4e8ca" text-anchor="start" >No autonomous decorative chemistry, no per-tile effects nodes, no fabricated loading boundary or new sanctuary.</text></svg>