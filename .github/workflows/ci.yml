name: Windows foundation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  headless:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Current build guidance (source only)
        shell: pwsh
        run: |
          scripts/test-current-build-summary.ps1
          scripts/test-ci-focused-suites.ps1
          scripts/test-current-delivery.ps1
          scripts/test-launcher-lifecycle.ps1
          scripts/test-launcher-diagnostic.ps1
          scripts/test-launcher-profile.ps1
          scripts/check-current-delivery.ps1
          scripts/current-build-summary.ps1 -CheckPath README.md
          scripts/test-runtime-build-identity.ps1
          scripts/test-gameplay-profile.ps1
          scripts/runtime-build-identity.ps1 -Mode Check
      - name: Install pinned Godot
        shell: pwsh
        run: |
          $url = 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip'
          $expected = 'c7a289051eaefb460b0106b60e9cd5bee0ef55fd102dcb2bed1eb356cf3d90a1'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.1-win64.zip'
          $root = Join-Path $env:RUNNER_TEMP 'godot-4.7.1'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Godot archive checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $binary = Join-Path $root 'Godot_v4.7.1-stable_win64.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Pinned Godot binary was not extracted.' }
          "FLUX2_GODOT_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $binary --version
      - name: Headless import and tests
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            scripts/test.ps1 -Tier Fast
            $plan = & scripts/ci-focused-suites.ps1
            foreach ($shard in $plan.shards) {
              $receipt = Join-Path $env:GITHUB_WORKSPACE ('.godot/receipts/pr-' + $shard.name + '.json')
              if (Test-Path -LiteralPath $receipt) { throw "PR shard receipt already exists: $receipt" }
              scripts/test.ps1 -Tier Focused -Suite $shard.suites -ReceiptPath $receipt
              scripts/ci-focused-suites.ps1 -Shard $shard.name -ReceiptPath $receipt
            }
          } else {
            scripts/test.ps1 -Tier Full
          }
      - name: Diff hygiene
        shell: pwsh
        run: git diff --check
      - name: Collect validation evidence
        if: always()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'hex-validation-evidence'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $runs = Join-Path $env:GITHUB_WORKSPACE '.godot/windows-tests'
          if (Test-Path -LiteralPath $runs) {
            foreach ($run in Get-ChildItem -LiteralPath $runs -Directory) {
              $target = Join-Path $destination $run.Name
              New-Item -ItemType Directory -Path $target -Force | Out-Null
              foreach ($file in Get-ChildItem -LiteralPath $run.FullName -File) {
                if ($file.Name -match '\.(log|log\.err|json)$') { Copy-Item -LiteralPath $file.FullName -Destination $target }
              }
            }
          }
          $receipts = Join-Path $env:GITHUB_WORKSPACE '.godot/receipts'
          if (Test-Path -LiteralPath $receipts) {
            foreach ($file in Get-ChildItem -LiteralPath $receipts -File -Filter '*.json') {
              Copy-Item -LiteralPath $file.FullName -Destination $destination
            }
          }
      - name: Retain passing and failed validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, pinned 2026-10-12
        with:
          name: hex-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hex-validation-evidence/
          retention-days: 14
          if-no-files-found: warn
